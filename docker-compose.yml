services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isabel}
      POSTGRES_USER: ${POSTGRES_USER:-isabel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isabel_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isabel} -d ${POSTGRES_DB:-isabel}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [isabel-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [isabel-net]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
    networks: [isabel-net]

  sglang:
    image: lmsysorg/sglang:latest
    restart: unless-stopped
    profiles: ["gpu"]
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      HF_HOME: /models/hf
    volumes:
      - ${MODELS_DIR:-./models}:/models/host:ro
    command: >
      python3 -m sglang.launch_server
      --model-path ${SGLANG_MODEL_PATH:-/models/host/current-llm}
      --host 0.0.0.0 --port 30000
      --mem-fraction-static ${MEM_FRACTION_STATIC:-0.80}
      --context-length ${MAX_MODEL_LEN:-8192}
      --tp ${TP_SIZE:-1} --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [isabel-net]

  gateway:
    build: ./server
    image: isabel-gateway:${ISABEL_VERSION:-1.0.2}
    restart: unless-stopped
    env_file: .env
    environment:
      ISABEL_VERSION: ${ISABEL_VERSION:-1.0.2}
      SGLANG_URL: ${SGLANG_URL:-http://sglang:30000}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-isabel}:${POSTGRES_PASSWORD:-isabel_change_me}@postgres:5432/${POSTGRES_DB:-isabel}
      API_TOKEN: ${API_TOKEN:-dev-token-change-me}
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
    volumes:
      - corpus:/corpus
      - workspace:/workspace
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [isabel-net]

  frontend:
    build: ./web
    image: isabel-frontend:${ISABEL_VERSION:-1.0.2}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - gateway
    networks: [isabel-net]

  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - gateway
    networks: [isabel-net]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  corpus:
  workspace:
  appdata:

networks:
  isabel-net:
    driver: bridge
