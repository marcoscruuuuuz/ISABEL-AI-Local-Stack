# ISABEL - Docker Compose otimizado
# docker compose up -d
# docker compose --profile gpu up -d
# docker compose --profile cloudflare up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isabel}
      POSTGRES_USER: ${POSTGRES_USER:-isabel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isabel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [isabel-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [isabel-net]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrantdata:/qdrant/storage
      - ./configs/qdrant.yaml:/qdrant/config/production.yaml:ro
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [isabel-net]

  sglang:
    image: lmsysorg/sglang:latest
    restart: unless-stopped
    logging: *default-logging
    profiles: ["gpu"]
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      HF_HOME: /models/hf
    volumes:
      - ${MODELS_DIR:-./models}:/models/host:ro
    command: >
      python3 -m sglang.launch_server
      --model-path ${SGLANG_MODEL_PATH:-/models/host/current-llm}
      --host 0.0.0.0 --port 30000
      --mem-fraction-static ${MEM_FRACTION_STATIC:-0.80}
      --context-length ${MAX_MODEL_LEN:-8192}
      --tp ${TP_SIZE:-1} --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [isabel-net]

  gateway:
    build: ./server
    image: isabel-gateway:${ISABEL_VERSION:-1.0.2}
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      ISABEL_VERSION: ${ISABEL_VERSION:-1.0.2}
      SGLANG_URL: ${SGLANG_URL:-http://sglang:30000}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-isabel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-isabel}
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
    volumes:
      - corpus:/corpus
      - workspace:/workspace
      - appdata:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [isabel-net]

  frontend:
    build: ./web
    image: isabel-frontend:${ISABEL_VERSION:-1.0.2}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      gateway: { condition: service_healthy }
    networks: [isabel-net]

  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    restart: unless-stopped
    logging: *default-logging
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      gateway: { condition: service_healthy }
    networks: [isabel-net]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  corpus:
  workspace:
  appdata:

networks:
  isabel-net:
    driver: bridge
