<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ISABEL Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes pulse-dot{0%,100%{opacity:.35}50%{opacity:1}}
.typing span{animation:pulse-dot 1.2s infinite;display:inline-block}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
</style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col">
<header class="border-b border-gray-800 px-4 py-3 flex items-center justify-between bg-gray-900/80">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center font-bold text-sm">IS</div>
<div><div class="font-semibold text-sm">ISABEL</div><div class="text-xs text-gray-500">Chat · Agentes locais · Research</div></div>
</div>
<a href="/admin/" class="text-sm text-gray-400 hover:text-white">Admin</a>
</header>
<div class="flex-1 flex overflow-hidden">
<aside class="w-56 border-r border-gray-800 p-3 hidden md:flex flex-col gap-2 text-sm">
<div class="text-xs text-gray-500 uppercase mb-1">Modos</div>
<button onclick="setMode('chat')" class="text-left px-3 py-2 rounded-lg hover:bg-gray-800" id="m-chat">Chat ISABEL</button>
<button onclick="setMode('agent')" class="text-left px-3 py-2 rounded-lg hover:bg-gray-800" id="m-agent">Agente local</button>
<button onclick="setMode('research')" class="text-left px-3 py-2 rounded-lg hover:bg-gray-800" id="m-research">Deep Research</button>
<div class="text-xs text-gray-500 uppercase mt-4 mb-1">Agentes</div>
<div id="agent-list" class="text-xs text-gray-400 space-y-1 flex-1 overflow-auto"></div>
<div class="text-xs text-gray-600 mt-auto pt-2 border-t border-gray-800">Dica: <code class="text-violet-400">AGENTE-PC-financeiro01 quantos R$ hoje?</code></div>
</aside>
<section class="flex-1 flex flex-col">
<div id="messages" class="flex-1 overflow-y-auto p-4 space-y-5"></div>
<div class="border-t border-gray-800 p-4">
<div class="max-w-3xl mx-auto relative">
<textarea id="input" rows="1" placeholder="Mensagem para ISABEL..." class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-4 py-3 pr-14 resize-none focus:outline-none focus:ring-2 focus:ring-violet-500 text-sm" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
<button onclick="send()" class="absolute right-3 bottom-2.5 w-9 h-9 rounded-xl bg-violet-600 hover:bg-violet-500 flex items-center justify-center text-white">↑</button>
</div></div></section></div>
<script>
const API='/api', TOKEN=localStorage.getItem('isabel_token')||'troque-este-token-muito-forte-aqui', TENANT=localStorage.getItem('isabel_tenant')||'default';
const headers={'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json','X-Tenant-Id':TENANT};
let mode='chat';
function setMode(m){mode=m;['chat','agent','research'].forEach(x=>document.getElementById('m-'+x).classList.toggle('bg-violet-600/20',x===m));}
function append(role,content,meta){
const box=document.getElementById('messages');
const div=document.createElement('div');
div.className='flex gap-3 max-w-3xl mx-auto '+(role==='user'?'flex-row-reverse':'');
div.innerHTML='<div class="w-8 h-8 rounded-full flex-shrink-0 '+(role==='user'?'bg-gray-600':'bg-gradient-to-br from-violet-500 to-fuchsia-500')+'"></div><div class="'+(role==='user'?'text-right':'')+' min-w-0"><div class="text-xs mb-1 '+(role==='user'?'text-gray-500':'text-violet-300')+'">'+(role==='user'?'Você':(meta||'ISABEL'))+'</div><div class="text-gray-200 text-sm leading-relaxed whitespace-pre-wrap break-words">'+content+'</div></div>';
box.appendChild(div);div.scrollIntoView({behavior:'smooth'});
}
function typing(on){document.getElementById('typing')?.remove();if(!on)return;const div=document.createElement('div');div.id='typing';div.className='flex gap-3 max-w-3xl mx-auto';div.innerHTML='<div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500"></div><div class="typing text-gray-500 pt-2"><span>•</span><span>•</span><span>•</span></div>';document.getElementById('messages').appendChild(div);}
function parseAgentCall(text){const m=text.match(/^(AGENTE-PC-[\w\-]+)\s+(.+)$/i);return m?{agent:m[1],question:m[2]}:null;}
async function send(){
const input=document.getElementById('input');const text=input.value.trim();if(!text)return;input.value='';append('user',text);typing(true);
try{
const agentCall=parseAgentCall(text);
if(agentCall&&agentCall.agent.toUpperCase().startsWith('AGENTE-')){
const r=await fetch(API+'/fleet/query',{method:'POST',headers,body:JSON.stringify({agent_name:agentCall.agent,question:agentCall.question})});
const data=await r.json();typing(false);
if(!r.ok){append('assistant',data.detail||JSON.stringify(data),'Erro');return;}
append('assistant',data.answer||JSON.stringify(data),data.offline?'Agente OFFLINE':'Agente '+data.agent_name);return;
}
if(mode==='research'){
const r=await fetch(API+'/research',{method:'POST',headers,body:JSON.stringify({question:text})});
const data=await r.json();typing(false);append('assistant',data.report||JSON.stringify(data,null,2),'Deep Research');return;
}
const r=await fetch(API+'/v1/chat/completions',{method:'POST',headers,body:JSON.stringify({messages:[{role:'user',content:text}],temperature:0.2})});
const data=await r.json();typing(false);append('assistant',data.choices?.[0]?.message?.content||JSON.stringify(data));
}catch(e){typing(false);append('assistant','Erro: '+e.message,'Sistema');}
}
async function loadAgents(){try{const r=await fetch(API+'/fleet/agents',{headers});const agents=await r.json();
document.getElementById('agent-list').innerHTML=(agents||[]).slice(0,20).map(a=>'<div class="truncate cursor-pointer hover:text-violet-300" onclick="document.getElementById(\'input\').value=\''+a.name+' \'"><span class="'+(a.status==='online'?'text-emerald-400':'text-gray-600')+'">●</span> '+a.name+'</div>').join('')||'<div class="text-gray-600">Nenhum agente</div>';}catch(e){}}
append('assistant','Olá! Sou a ISABEL.\n\n• Chat geral: pergunte normalmente\n• Agente local: AGENTE-PC-financeiro01 quantos R$ foram lançados hoje?\n• Research: use o modo Deep Research');
setMode('chat');loadAgents();setInterval(loadAgents,30000);
</script>
</body>
</html>
