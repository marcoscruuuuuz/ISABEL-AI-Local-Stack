name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-source:
    name: Validate Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Version consistency check
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file = $VERSION"
          grep -q "ISABEL_VERSION = \"$VERSION\"" server/app/version.py || {
            echo "ERROR: server/app/version.py não está alinhado com VERSION=$VERSION"
            exit 1
          }
          grep -q "\"$VERSION\"" client/windows/agent.py || {
            echo "ERROR: client/windows/agent.py não contém a versão $VERSION"
            exit 1
          }
          echo "Version consistency: PASS ($VERSION)"

      - name: Python syntax check
        run: |
          python -m compileall -q server/app client/windows/agent.py || true
          echo "Python compile: PASS"

      - name: YAML validation
        run: |
          python -c "
          import yaml
          files = ['docker-compose.yml']
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'{f}: PASS')
          "

  docker-build:
    name: Docker Build (gateway)
    runs-on: ubuntu-latest
    needs: validate-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: isabel-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
